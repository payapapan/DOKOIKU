<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DOKOIKU</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<style>
  @font-face {
    font-family: 'system-serif';
    src: local('Georgia');
  }

  :root {
    --navy: #16233A;
    --navy-deep: #0D1626;
    --parchment: #EDE7D8;
    --parchment-dim: #D8CFB8;
    --brass: #C9A227;
    --brass-bright: #E4BE4A;
    --ink: #2A2118;
    --route: #7A8B7F;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--navy-deep);
    color: var(--parchment);
    font-family: Georgia, 'Hiragino Mincho ProN', serif;
    overflow: hidden;
  }

  #app {
    position: relative;
    width: 100%;
    height: 100vh;
  }

  #map {
    position: absolute;
    inset: 0;
    filter: sepia(8%) saturate(85%) brightness(0.96);
  }

  /* ---- Top bar: journal header ---- */
  .header {
    position: absolute;
    top: 0; left: 0; right: 0;
    z-index: 500;
    padding: 18px 20px 14px;
    background: linear-gradient(180deg, rgba(13,22,38,0.92) 0%, rgba(13,22,38,0.55) 70%, transparent 100%);
    pointer-events: none;
  }

  .header .brand {
    display: flex;
    align-items: baseline;
    gap: 10px;
  }

  .header .brand .mark {
    font-family: 'Courier New', monospace;
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--brass);
    border: 1px solid var(--brass);
    padding: 2px 6px;
    border-radius: 2px;
  }

  .header h1 {
    margin: 0;
    font-size: 22px;
    letter-spacing: 6px;
    font-weight: 400;
    color: var(--parchment);
    text-shadow: 0 2px 8px rgba(0,0,0,0.5);
  }

  .header .sub {
    margin: 4px 0 0;
    font-family: 'Courier New', monospace;
    font-size: 11px;
    letter-spacing: 1.5px;
    color: var(--parchment-dim);
    opacity: 0.85;
  }

  /* ---- Bottom control panel ---- */
  .panel {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    z-index: 500;
    background: linear-gradient(180deg, transparent 0%, rgba(13,22,38,0.94) 28%, var(--navy-deep) 100%);
    padding: 40px 20px 22px;
  }

  .radius-row {
    display: flex;
    align-items: center;
    gap: 14px;
    max-width: 420px;
    margin: 0 auto 18px;
    font-family: 'Courier New', monospace;
    font-size: 12px;
    letter-spacing: 1px;
    color: var(--parchment-dim);
  }

  .radius-row .val {
    color: var(--brass-bright);
    min-width: 58px;
    text-align: right;
  }

  input[type="range"] {
    -webkit-appearance: none;
    flex: 1;
    height: 2px;
    background: var(--parchment-dim);
    opacity: 0.5;
    outline: none;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--brass);
    border: 2px solid var(--parchment);
    cursor: pointer;
    margin-top: -6px;
  }

  .roll-wrap {
    display: flex;
    justify-content: center;
  }

  #rollBtn {
    position: relative;
    width: 88px; height: 88px;
    border-radius: 50%;
    border: 2px solid var(--brass);
    background: radial-gradient(circle at 35% 30%, #223350, var(--navy) 70%);
    color: var(--brass-bright);
    font-family: 'Courier New', monospace;
    font-size: 11px;
    letter-spacing: 2px;
    cursor: pointer;
    box-shadow: 0 0 0 6px rgba(201,162,39,0.08), 0 8px 24px rgba(0,0,0,0.5);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  #rollBtn:active { transform: scale(0.94); }
  #rollBtn.spinning .needle {
    animation: spin 0.9s cubic-bezier(.2,.9,.3,1) infinite;
  }
  #rollBtn .needle {
    position: absolute;
    top: 8px; left: 50%;
    width: 2px; height: 30px;
    background: linear-gradient(180deg, var(--brass-bright), transparent);
    transform-origin: bottom center;
    transform: translateX(-50%);
  }
  #rollBtn .label {
    position: absolute;
    bottom: 16px; left: 0; right: 0;
    text-align: center;
  }
  @keyframes spin {
    from { transform: translateX(-50%) rotate(0deg); }
    to { transform: translateX(-50%) rotate(360deg); }
  }

  .status {
    text-align: center;
    margin-top: 12px;
    font-family: 'Courier New', monospace;
    font-size: 11px;
    letter-spacing: 1px;
    color: var(--parchment-dim);
    min-height: 16px;
  }

  /* ---- Result card: stamped ticket ---- */
  #resultCard {
    position: absolute;
    left: 50%;
    bottom: 190px;
    transform: translateX(-50%) translateY(20px) scale(0.96);
    z-index: 600;
    width: min(340px, calc(100% - 40px));
    background: var(--parchment);
    color: var(--ink);
    border-radius: 3px;
    padding: 18px 20px 16px;
    box-shadow: 0 18px 40px rgba(0,0,0,0.55);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.35s ease, transform 0.35s ease;
  }
  #resultCard.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0) scale(1);
    pointer-events: auto;
  }
  #resultCard::before {
    content: '';
    position: absolute;
    top: -8px; left: 24px;
    width: 16px; height: 16px;
    background: var(--parchment);
    transform: rotate(45deg);
    box-shadow: -4px -4px 6px -4px rgba(0,0,0,0.2);
  }
  .card-eyebrow {
    font-family: 'Courier New', monospace;
    font-size: 10px;
    letter-spacing: 2px;
    color: #8a6d1f;
    display: flex;
    justify-content: space-between;
  }
  .card-name {
    font-size: 20px;
    line-height: 1.3;
    margin: 8px 0 4px;
    font-weight: 700;
  }
  .card-type {
    font-family: 'Courier New', monospace;
    font-size: 11px;
    letter-spacing: 1px;
    color: #6b5d47;
    margin-bottom: 10px;
  }
  .card-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 1px dashed #b8ab8a;
    padding-top: 10px;
    font-family: 'Courier New', monospace;
    font-size: 11px;
  }
  .card-meta .dist { color: #4b4030; }
  .card-meta a {
    color: #16233A;
    text-decoration: none;
    font-weight: 700;
    letter-spacing: 1px;
    border-bottom: 1px solid #16233A;
  }

  .leaflet-popup-content-wrapper {
    background: var(--parchment);
    color: var(--ink);
    font-family: Georgia, serif;
  }
  .leaflet-popup-tip { background: var(--parchment); }

  .locate-panel {
    position: absolute;
    inset: 0;
    z-index: 900;
    background: radial-gradient(circle at 50% 30%, #1c2c48 0%, var(--navy-deep) 75%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .locate-inner {
    width: min(360px, 100%);
    text-align: center;
  }
  .locate-title {
    font-size: 20px;
    letter-spacing: 3px;
    margin: 0 0 10px;
    color: var(--parchment);
  }
  .locate-desc {
    font-family: 'Courier New', monospace;
    font-size: 11px;
    line-height: 1.6;
    color: var(--parchment-dim);
    margin: 0 0 20px;
  }
  .locate-row {
    display: flex;
    gap: 8px;
  }
  #placeInput {
    flex: 1;
    padding: 12px 12px;
    border-radius: 3px;
    border: 1px solid var(--brass);
    background: var(--parchment);
    color: var(--ink);
    font-family: Georgia, serif;
    font-size: 14px;
    outline: none;
  }
  #placeSearchBtn {
    padding: 12px 16px;
    border-radius: 3px;
    border: 1px solid var(--brass);
    background: var(--brass);
    color: var(--navy-deep);
    font-family: 'Courier New', monospace;
    font-weight: 700;
    letter-spacing: 1px;
    cursor: pointer;
  }
  .locate-status {
    min-height: 18px;
    margin-top: 12px;
    font-family: 'Courier New', monospace;
    font-size: 11px;
    color: var(--brass-bright);
  }
  .locate-alt {
    margin-top: 18px;
    background: none;
    border: none;
    color: var(--parchment-dim);
    font-family: 'Courier New', monospace;
    font-size: 10px;
    letter-spacing: 1px;
    text-decoration: underline;
    cursor: pointer;
  }
  .locate-panel.hidden { display: none; }

  .toast {
    position: absolute;
    top: 90px; left: 50%;
    transform: translateX(-50%);
    z-index: 700;
    background: rgba(200, 70, 60, 0.95);
    color: #fff;
    font-family: 'Courier New', monospace;
    font-size: 12px;
    letter-spacing: 0.5px;
    padding: 10px 16px;
    border-radius: 3px;
    max-width: 80%;
    text-align: center;
    box-shadow: 0 8px 20px rgba(0,0,0,0.4);
    opacity: 0;
    transition: opacity 0.3s ease;
    pointer-events: none;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<div id="app">
  <div id="map"></div>

  <div class="header">
    <div class="brand">
      <span class="mark">field guide</span>
      <h1>DOKOIKU</h1>
    </div>
    <p class="sub">現在地から気ままに、行き先をひとつ引く。</p>
  </div>

  <div class="locate-panel" id="locatePanel">
    <div class="locate-inner">
      <p class="locate-title">出発地点を設定</p>
      <p class="locate-desc">この環境では自動での現在地取得がブロックされる場合があります。地名を入力してください（例：名古屋駅、栄、東京タワー）。</p>
      <div class="locate-row">
        <input type="text" id="placeInput" placeholder="地名・駅名・住所" />
        <button id="placeSearchBtn">検索</button>
      </div>
      <div class="locate-status" id="locateStatus"></div>
      <button id="tryGeoBtn" class="locate-alt">端末の位置情報を試す</button>
    </div>
  </div>

  <div id="resultCard">
    <div class="card-eyebrow"><span>DESTINATION</span><span id="cardIndex">No. 001</span></div>
    <div class="card-name" id="cardName">—</div>
    <div class="card-type" id="cardType">—</div>
    <div class="card-meta">
      <span class="dist" id="cardDist">— m</span>
      <a id="cardLink" href="#" target="_blank" rel="noopener">経路を見る →</a>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <div class="panel">
    <div class="radius-row">
      <span>RADIUS</span>
      <input type="range" id="radiusSlider" min="300" max="3000" step="100" value="1000">
      <span class="val" id="radiusVal">1000 m</span>
    </div>
    <div class="roll-wrap">
      <button id="rollBtn">
        <span class="needle"></span>
        <span class="label">引く</span>
      </button>
    </div>
    <div class="status" id="statusLine">現在地を取得してください</div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(function () {
  let map, userMarker, resultMarker, userLoc = null;
  let visitCount = 0;
  let lastCandidates = [];

  const statusLine = document.getElementById('statusLine');
  const rollBtn = document.getElementById('rollBtn');
  const resultCard = document.getElementById('resultCard');
  const toast = document.getElementById('toast');
  const radiusSlider = document.getElementById('radiusSlider');
  const radiusVal = document.getElementById('radiusVal');

  function showToast(msg, ms = 3200) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => toast.classList.remove('show'), ms);
  }

  function initMap(lat, lon) {
    map = L.map('map', { zoomControl: false, attributionControl: true }).setView([lat, lon], 15);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors',
      maxZoom: 19
    }).addTo(map);
    L.control.zoom({ position: 'bottomright' }).addTo(map);

    const userIcon = L.divIcon({
      className: '',
      html: '<div style="width:14px;height:14px;border-radius:50%;background:#E4BE4A;border:2px solid #16233A;box-shadow:0 0 0 6px rgba(228,190,74,0.25);"></div>',
      iconSize: [14, 14],
      iconAnchor: [7, 7]
    });
    userMarker = L.marker([lat, lon], { icon: userIcon }).addTo(map);
  }

  const locatePanel = document.getElementById('locatePanel');
  const placeInput = document.getElementById('placeInput');
  const placeSearchBtn = document.getElementById('placeSearchBtn');
  const tryGeoBtn = document.getElementById('tryGeoBtn');
  const locateStatus = document.getElementById('locateStatus');

  function setLocation(lat, lon, label) {
    userLoc = { lat, lon };
    initMap(lat, lon);
    locatePanel.classList.add('hidden');
    statusLine.textContent = label ? `${label} を出発地点に設定しました` : '準備完了。「引く」を押してください';
  }

  async function geocodePlace(text) {
    const url = 'https://nominatim.openstreetmap.org/search?format=json&limit=1&accept-language=ja&q=' + encodeURIComponent(text);
    const res = await fetch(url);
    if (!res.ok) throw new Error('geocode_error');
    const data = await res.json();
    if (!data.length) throw new Error('not_found');
    return { lat: parseFloat(data[0].lat), lon: parseFloat(data[0].lon), name: data[0].display_name };
  }

  placeSearchBtn.addEventListener('click', async () => {
    const q = placeInput.value.trim();
    if (!q) { locateStatus.textContent = '地名を入力してください'; return; }
    locateStatus.textContent = '検索中…';
    try {
      const found = await geocodePlace(q);
      setLocation(found.lat, found.lon, q);
    } catch (e) {
      locateStatus.textContent = '見つかりませんでした。別の表記で試してください';
    }
  });

  placeInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') placeSearchBtn.click();
  });

  tryGeoBtn.addEventListener('click', () => {
    if (!navigator.geolocation) {
      locateStatus.textContent = 'この環境では端末の位置情報を利用できません（地名検索をご利用ください）';
      return;
    }
    locateStatus.textContent = '端末の位置情報を確認中…';
    navigator.geolocation.getCurrentPosition(
      (pos) => setLocation(pos.coords.latitude, pos.coords.longitude, '現在地'),
      (err) => {
        locateStatus.textContent = '端末の位置情報を取得できませんでした（サンドボックス制限の可能性）。地名検索をご利用ください';
      },
      { enableHighAccuracy: true, timeout: 8000 }
    );
  });

  function haversine(lat1, lon1, lat2, lon2) {
    const R = 6371000;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  }

  const TAG_LABELS = {
    'tourism=attraction': '観光スポット',
    'tourism=museum': '博物館・美術館',
    'tourism=viewpoint': '展望スポット',
    'tourism=artwork': 'アート作品',
    'tourism=gallery': 'ギャラリー',
    'leisure=park': '公園',
    'leisure=garden': '庭園',
    'historic=castle': '城',
    'historic=monument': '記念碑',
    'historic=ruins': '遺跡',
    'amenity=place_of_worship': '寺社・教会',
    'amenity=cafe': 'カフェ',
    'shop=bakery': 'パン屋'
  };

  function buildQuery(lat, lon, radius) {
    const filters = Object.keys(TAG_LABELS).map(pair => {
      const [k, v] = pair.split('=');
      return `node["${k}"="${v}"](around:${radius},${lat},${lon});`;
    }).join('\n');
    return `[out:json][timeout:20];(${filters});out body;`;
  }

  async function fetchCandidates(lat, lon, radius) {
    const query = buildQuery(lat, lon, radius);
    const res = await fetch('https://overpass-api.de/api/interpreter', {
      method: 'POST',
      body: 'data=' + encodeURIComponent(query)
    });
    if (!res.ok) throw new Error('overpass_error');
    const data = await res.json();
    return (data.elements || []).filter(el => el.tags && el.tags.name);
  }

  function labelFor(tags) {
    for (const key of Object.keys(TAG_LABELS)) {
      const [k, v] = key.split('=');
      if (tags[k] === v) return TAG_LABELS[key];
    }
    return 'スポット';
  }

  async function roll() {
    if (!userLoc) { showToast('現在地が未取得です'); return; }
    rollBtn.classList.add('spinning');
    rollBtn.disabled = true;
    resultCard.classList.remove('show');
    statusLine.textContent = '周辺の候補を探索中…';

    const radius = parseInt(radiusSlider.value, 10);

    try {
      let candidates = lastCandidates;
      if (!candidates.length || roll._lastRadius !== radius) {
        candidates = await fetchCandidates(userLoc.lat, userLoc.lon, radius);
        lastCandidates = candidates;
        roll._lastRadius = radius;
      }

      if (!candidates.length) {
        statusLine.textContent = 'この範囲に候補が見つかりませんでした。半径を広げてみてください';
        showToast('候補ゼロ。RADIUSを広げて再挑戦を');
        return;
      }

      const pick = candidates[Math.floor(Math.random() * candidates.length)];
      const dist = Math.round(haversine(userLoc.lat, userLoc.lon, pick.lat, pick.lon));

      if (resultMarker) map.removeLayer(resultMarker);
      const pinIcon = L.divIcon({
        className: '',
        html: '<div style="width:16px;height:16px;border-radius:50% 50% 50% 0;background:#C9A227;border:2px solid #16233A;transform:rotate(-45deg);"></div>',
        iconSize: [16, 16],
        iconAnchor: [8, 16]
      });
      resultMarker = L.marker([pick.lat, pick.lon], { icon: pinIcon }).addTo(map);
      resultMarker.bindPopup(`<b>${pick.tags.name}</b><br>${labelFor(pick.tags)}`).openPopup();

      const bounds = L.latLngBounds([[userLoc.lat, userLoc.lon], [pick.lat, pick.lon]]);
      map.fitBounds(bounds, { padding: [80, 80], maxZoom: 17 });

      visitCount += 1;
      document.getElementById('cardIndex').textContent = 'No. ' + String(visitCount).padStart(3, '0');
      document.getElementById('cardName').textContent = pick.tags.name;
      document.getElementById('cardType').textContent = labelFor(pick.tags);
      document.getElementById('cardDist').textContent = dist + ' m 先';
      document.getElementById('cardLink').href =
        `https://www.google.com/maps/dir/?api=1&origin=${userLoc.lat},${userLoc.lon}&destination=${pick.lat},${pick.lon}`;
      resultCard.classList.add('show');

      statusLine.textContent = `候補 ${candidates.length} 件から抽選しました`;
    } catch (e) {
      statusLine.textContent = '取得に失敗しました。時間をおいて再度お試しください';
      showToast('Overpass APIへの接続に失敗しました');
    } finally {
      rollBtn.classList.remove('spinning');
      rollBtn.disabled = false;
    }
  }

  radiusSlider.addEventListener('input', () => {
    radiusVal.textContent = radiusSlider.value + ' m';
    lastCandidates = [];
  });

  rollBtn.addEventListener('click', roll);
})();
</script>
</body>
</html>
